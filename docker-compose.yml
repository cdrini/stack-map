services:
  stack-map:
    # Explicit tag so `docker load`-ing an image built elsewhere (e.g. on a
    # machine with full internet access, then scp'd over) is what `docker
    # compose up` actually runs, rather than compose deriving some other
    # name and rebuilding from scratch on a host that can't reach every
    # registry `build:` below needs.
    image: stack-map:latest
    build:
      context: .
      args:
        # e.g. STACKMAP_BASE_PATH=/stack-map/ in a .env file next to this
        # compose file (not server/.env — that one's for the container's
        # own runtime env, this is a build-time arg) when deployed behind
        # an nginx location that forwards its full path through unchanged.
        # Defaults to the domain root, matching STACKMAP_BASE_PATH's
        # runtime default below.
        BASE_PATH: ${STACKMAP_BASE_PATH:-/}
    ports:
      - "8000:8000"
    env_file:
      - server/.env
    # stack.yaml is never baked into the image (it names real internal
    # infrastructure) — mount your local copy in read-only and point the
    # server at it. STACKMAP_SPEC_PATH's default (../src/stack.yaml,
    # relative to server/) is a local-dev-only path that doesn't exist
    # inside the container, so this must be set here.
    volumes:
      - ./src/stack.yaml:/data/stack.yaml:ro
    environment:
      STACKMAP_SPEC_PATH: /data/stack.yaml
      STACKMAP_BASE_PATH: ${STACKMAP_BASE_PATH:-}
    # Lets STACKMAP_PROMETHEUS_URL_OVERRIDE reach a tunnel/service running on
    # the host from Linux too — Docker Desktop (Mac/Windows) already resolves
    # host.docker.internal without this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
